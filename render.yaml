# SecOps Universal — Blueprint para Render

services:
  - type: web
    name: secops-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: render-start.sh
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@secops.local
      - key: ADMIN_PASSWORD
        value: "Admin1234!"
      - key: ADMIN_NAME
        value: Administrador SecOps
